name: Set up project Zig
description: Install Arch Zig 0.17
runs:
  using: composite
  steps:
    # Run after system updates so they cannot upgrade the compiler mid-job.
    - name: Install Zig
      shell: bash
      run: |
        pacman -S --needed --noconfirm zig
        case "$(zig version)" in 0.17*) ;; *) echo "unexpected zig $(zig version)" >&2; exit 1 ;; esac
        zig version
