name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel gtk4 glibc git curl pkgconf

      # Checkout only after git is installed in the container.
      - uses: actions/checkout@v6

      - name: Build Pori.Ui
        run: |
          (cd Pori.Ui && zig build --verbose \
            --prefix ../publish/build \
            -Dcpu=baseline \
            -Doptimize=ReleaseSafe)

      - name: Run tests
        run: cd Pori.Ui && zig build test

      - name: Publish
        run: |
          mkdir -p publish/pori
          install -Dm755 publish/build/bin/pori publish/pori/pori
          install -m644 Pori.Ui/assets/pori.png publish/pori/
          install -m644 LICENSE publish/pori/

      - name: Create tarball
        run: tar -czf publish/Pori-linux-x64.tar.gz -C publish/pori .

      - name: Generate SHA256 checksums
        run: |
          cd publish
          VERSION=${GITHUB_REF#refs/tags/}
          curl -sL "https://github.com/Seafoam-Labs/Pori/archive/${VERSION}.tar.gz" -o "source-${VERSION}.tar.gz"
          sha256sum "source-${VERSION}.tar.gz" | sed "s/source-${VERSION}.tar.gz/${VERSION}.tar.gz/" > SHA256SUMS.txt
          sha256sum Pori-linux-x64.tar.gz >> SHA256SUMS.txt
          rm "source-${VERSION}.tar.gz"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/Pori-linux-x64.tar.gz
            publish/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
